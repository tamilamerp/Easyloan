<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Management System</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #f0f4f8;
            --text-color: #333;
            --accent-color: #34a853;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        /* Splash / First Page with Logo */
        #splash-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container i {
            font-size: 80px;
            color: var(--primary-color);
        }

        .logo-container h1 {
            font-size: 26px;
            margin-top: 15px;
            color: var(--primary-color);
        }

        .launch-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3);
        }

        .launch-btn:hover {
            background-color: #1557b0;
        }

        /* Main Application Section */
        #main-app {
            display: none;
            padding: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .option-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fafafa;
        }

        .option-card i {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .option-card div {
            font-size: 14px;
            font-weight: 600;
        }

        .option-card.selected {
            border-color: var(--primary-color);
            background-color: #e8f0fe;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #2b8a43;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. First Page: Logo and Launch Button -->
        <div id="splash-screen">
            <div class="logo-container">
                <i class="fa-solid fa-landmark-dome"></i>
                <h1>Loan Solutions</h1>
            </div>
            <button class="launch-btn" onclick="openApp()">Launch</button>
        </div>

        <!-- 2. Main App Screen -->
        <div id="main-app">
            <h2>Loan Calculator & Banks</h2>

            <!-- Loan Category Selection -->
            <div class="form-group">
                <label>Loan Type தேர்ந்தெெடுக்கவும்:</label>
                <div class="options-grid">
                    <div class="option-card" onclick="selectLoan('New Car', this)">
                        <i class="fa-solid fa-car"></i>
                        <div>New Car Loan</div>
                    </div>
                    <div class="option-card" onclick="selectLoan('Used Car', this)">
                        <i class="fa-solid fa-car-side"></i>
                        <div>Used Car Loan</div>
                    </div>
                    <div class="option-card" onclick="selectLoan('Bike', this)">
                        <i class="fa-solid fa-motorcycle"></i>
                        <div>Bike Loan</div>
                    </div>
                    <div class="option-card" onclick="selectLoan('Home', this)">
                        <i class="fa-solid fa-house"></i>
                        <div>Home Loan</div>
                    </div>
                </div>
            </div>

            <!-- Bank Selection with Icons -->
            <div class="form-group">
                <label for="bank-select"><i class="fa-solid fa-building-columns"></i> Bank தேர்ந்தெடுக்கவும்:</label>
                <select id="bank-select">
                    <option value="">-- வங்கியைத் தேர்ந்தெடுக்கவும் --</option>
                    <option value="sbi">🏦 State Bank of India (SBI)</option>
                    <option value="canara">🏦 Canara Bank</option>
                    <option value="hdfc">🏦 HDFC Bank</option>
                    <option value="icici">🏦 ICICI Bank</option>
                    <option value="axis">🏦 Axis Bank</option>
                    <option value="iob">🏦 Indian Overseas Bank (IOB)</option>
                </select>
            </div>

            <!-- Amount Input -->
            <div class="form-group">
                <label for="amount"><i class="fa-solid fa-indian-rupee-sign"></i> Loan Amount:</label>
                <input type="number" id="amount" placeholder="தொகையை உள்ளிடவும்">
            </div>

            <button class="submit-btn" onclick="submitData()">Process Loan</button>
        </div>
    </div>

    <script>
        let selectedLoanType = "";

        function openApp() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }

        function selectLoan(type, element) {
            selectedLoanType = type;
            let cards = document.querySelectorAll('.option-card');
            cards.forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        function submitData() {
            let bank = document.getElementById('bank-select').value;
            let amount = document.getElementById('amount').value;

            if (!selectedLoanType) {
                alert("தயவுசெய்து லோன் வகையைத் தேர்ந்தெடுக்கவும்!");
                return;
            }
            if (!bank) {
                alert("தயவுசெய்து வங்கியைத் தேர்ந்தெடுக்கவும்!");
                return;
            }
            if (!amount) {
                alert("தயவுசெய்து தொகையை உள்ளிடவும்!");
                return;
            }

            alert(`Success!\nLoan: ${selectedLoanType}\nBank: ${bank.toUpperCase()}\nAmount: ₹${amount}`);
        }
    </script>

</body>
</html>
