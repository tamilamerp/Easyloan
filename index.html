<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Management App</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a73e8;
            --bg-color: #f4f6f9;
            --text-main: #333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e4e9f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Screen Container */
        .mobile-frame {
            width: 100%;
            max-width: 400px;
            height: 750px;
            background: var(--bg-color);
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
            border: 10px solid #222;
            display: flex;
            flex-direction: column;
        }

        /* 1. Splash / Home Page with Logo */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: transform 0.5s ease-in-out;
        }

        .splash-logo {
            font-size: 80px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .splash-title {
            font-size: 24px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 40px;
        }

        .launch-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26,115,232,0.4);
            font-weight: 600;
        }

        /* 2. Main Application Area */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
            padding-bottom: 80px;
        }

        .header-title {
            font-size: 20px;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Loan Grid Cards */
        .loan-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .loan-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .loan-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .loan-card i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .loan-card h4 {
            font-size: 14px;
            color: var(--text-main);
        }

        /* Detailed Section (Initially hidden) */
        .detail-section {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: none;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .action-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 3. Bottom Navigation Bar (5 Headings) */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: var(--white);
            display: none;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #ddd;
            z-index: 5;
        }

        .nav-item {
            text-align: center;
            cursor: pointer;
            color: #777;
            font-size: 11px;
        }

        .nav-item i {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        
        <!-- Splash / Home Page: Logo Only -->
        <div id="splash-screen">
            <div class="splash-logo">
                <i class="fa-solid fa-landmark"></i>
            </div>
            <div class="splash-title">Loan CRM System</div>
            <button class="launch-btn" onclick="launchApp()">Launch</button>
        </div>

        <!-- Main Application Screen -->
        <div class="app-body" id="appBody">
            <div class="header-title">லோன் வகைகள் (Loan Types)</div>
            
            <!-- Loan Selection Grid -->
            <div class="loan-grid">
                <div class="loan-card" onclick="openLoanDetails('New Car Loan', 'fa-car')">
                    <i class="fa-solid fa-car"></i>
                    <h4>New Car Loan</h4>
                </div>
                <div class="loan-card" onclick="openLoanDetails('Used Car Loan', 'fa-car-side')">
                    <i class="fa-solid fa-car-side"></i>
                    <h4>Used Car Loan</h4>
                </div>
                <div class="loan-card" onclick="openLoanDetails('Bike Loan', 'fa-motorcycle')">
                    <i class="fa-solid fa-motorcycle"></i>
                    <h4>Bike Loan</h4>
                </div>
                <div class="loan-card" onclick="openLoanDetails('Home Loan', 'fa-house')">
                    <i class="fa-solid fa-house"></i>
                    <h4>Home Loan</h4>
                </div>
            </div>

            <!-- Detailed Functions Section (Appears on selecting a loan) -->
            <div class="detail-section" id="detailSection">
                <h3 id="selectedLoanTitle" style="color:var(--primary); margin-bottom:15px; font-size:16px;">Loan Details</h3>
                
                <div class="form-group">
                    <label>வங்கி தேர்ந்தெடுக்கவும் (Bank Name):</label>
                    <select id="bankName">
                        <option value="sbi">🏦 State Bank of India (SBI)</option>
                        <option value="canara">🏦 Canara Bank</option>
                        <option value="hdfc">🏦 HDFC Bank</option>
                        <option value="icici">🏦 ICICI Bank</option>
                        <option value="axis">🏦 Axis Bank</option>
                        <option value="iob">🏦 Indian Overseas Bank</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>லோன் தொகை (Loan Amount):</label>
                    <input type="number" id="loanAmount" placeholder="தொகையை உள்ளிடவும் (₹)">
                </div>

                <div class="form-group">
                    <label>கால அவகாசம் (Tenure in Years):</label>
                    <select id="tenure">
                        <option value="1">1 Year</option>
                        <option value="3">3 Years</option>
                        <option value="5">5 Years</option>
                        <option value="7">7 Years</option>
                    </select>
                </div>

                <button class="action-btn" onclick="processLoan()">Process Application</button>
            </div>
        </div>

        <!-- Bottom Navigation (5 Headings) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item active" onclick="navClick(this)">
                <i class="fa-solid fa-house"></i>
                Home
            </div>
            <div class="nav-item" onclick="navClick(this)">
                <i class="fa-solid fa-file-lines"></i>
                Applications
            </div>
            <div class="nav-item" onclick="navClick(this)">
                <i class="fa-solid fa-calculator"></i>
                EMI Calc
            </div>
            <div class="nav-item" onclick="navClick(this)">
                <i class="fa-solid fa-building-columns"></i>
                Banks
            </div>
            <div class="nav-item" onclick="navClick(this)">
                <i class="fa-solid fa-user"></i>
                Profile
            </div>
        </div>

    </div>

    <script>
        let currentLoan = "";

        function launchApp() {
            // Slide up effect for splash screen
            let splash = document.getElementById('splash-screen');
            splash.style.transform = "translateY(-100%)";
            
            setTimeout(() => {
                splash.style.display = "none";
                document.getElementById('appBody').style.display = "block";
                document.getElementById('bottomNav').style.display = "flex";
            }, 400);
        }

        function openLoanDetails(loanName, iconClass) {
            currentLoan = loanName;
            let detailSec = document.getElementById('detailSection');
            document.getElementById('selectedLoanTitle').innerHTML = `<i class="fa-solid ${iconClass}"></i> ${loanName} Process`;
            detailSec.style.display = "block";
            detailSec.scrollIntoView({ behavior: 'smooth' });
        }

        function processLoan() {
            let bank = document.getElementById('bankName').value;
            let amount = document.getElementById('loanAmount').value;
            let tenure = document.getElementById('tenure').value;

            if(!amount) {
                alert("தயவுசெய்து தொகையை உள்ளிடவும்!");
                return;
            }

            alert(`விவரங்கள் வெற்றிகரமாக சமர்ப்பிக்கப்பட்டன!\n\nLoan: ${currentLoan}\nBank: ${bank.toUpperCase()}\nAmount: ₹${amount}\nTenure: ${tenure} Years`);
        }

        function navClick(element) {
            let items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
