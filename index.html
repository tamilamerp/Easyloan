<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyLoan - All Loan Solutions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"

<style>

/* ===== RESET ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#f4f8ff;
color:#222;
}

/* ===== NAVBAR ===== */

header{

position:fixed;
top:0;
left:0;
width:100%;
background:white;
box-shadow:0 10px 30px rgba(0,0,0,.08);
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;

}

.logo{

font-size:32px;
font-weight:700;
color:#0d6efd;

}

nav a{

text-decoration:none;
margin-left:30px;
font-weight:500;
color:#444;
transition:.3s;

}

nav a:hover{

color:#0d6efd;

}

/* ===== HERO ===== */

.hero{

padding:150px 8% 80px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;

}

.hero-text{

flex:1;
min-width:350px;

}

.hero-text h1{

font-size:55px;
line-height:1.2;
margin-bottom:20px;

}

.hero-text span{

color:#0d6efd;

}

.hero-text p{

font-size:18px;
color:#666;
line-height:1.8;
margin-bottom:35px;

}

.btn{

display:inline-block;
background:#0d6efd;
color:white;
padding:16px 35px;
border-radius:50px;
text-decoration:none;
font-size:18px;
transition:.3s;

}

.btn:hover{

background:#0047c3;
transform:translateY(-3px);

}

.hero-image{

flex:1;
text-align:center;
min-width:350px;

}

.hero-image img{

width:100%;
max-width:520px;
